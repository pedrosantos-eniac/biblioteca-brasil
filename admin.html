<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse a área administrativa da Biblioteca Brasil.">
    <title>Biblioteca Brasil | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a class="marca" href="index.html" aria-label="Biblioteca Brasil - página inicial">
                <span class="marca-simbolo" aria-hidden="true">B<span>.</span></span>
                <span>Biblioteca Brasil</span>
            </a>
            <nav class="navegacao" aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="biblioteca.html">Minha Biblioteca</a>
                <a href="cadastro.html">Cadastrar Livro</a>
                <a class="link-login ativo" href="admin.html" aria-current="page">Login</a>
            </nav>
        </div>
    </header>

    <main class="pagina-interna pagina-login container">
        <section class="painel login-painel" aria-labelledby="titulo-login">
            <div class="login-icone" aria-hidden="true">B<span>.</span></div>
            <span class="etiqueta">ÁREA ADMINISTRATIVA</span>
            <h1 id="titulo-login">Bem-vindo!</h1>
            <p>Entre com suas credenciais para acessar a administração da biblioteca.</p>
            <form action="#" method="POST" class="formulario-login">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>
                <button type="submit" class="botao botao-primario botao-largura-total">Entrar</button>
            </form>
            <a class="voltar-login" href="index.html">← Voltar para a página inicial</a>
        </section>
    </main>

    <footer class="rodape">
        <div class="container rodape-conteudo">
            <span>Biblioteca Brasil</span>
            <p>Um espaço para cultivar o hábito da leitura.</p>
            <small>Projeto acadêmico · 2026</small>
        </div>
    </footer>
</body>
</html>
