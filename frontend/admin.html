<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse a área administrativa da Biblioteca Brasil.">
    <title>Biblioteca Brasil | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a class="marca" href="index.html" aria-label="Biblioteca Brasil - página inicial">
                <span class="marca-simbolo" aria-hidden="true">B<span>.</span></span>
                <span>Biblioteca Brasil</span>
            </a>
            <nav class="navegacao" aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="biblioteca.html">Minha Biblioteca</a>
                <a href="cadastro.html">Adicionar Livro</a>
                <a class="link-login ativo" href="admin.html" aria-current="page">Login</a>
            </nav>
        </div>
    </header>

    <main class="pagina-interna pagina-login container">
        <section class="painel login-painel" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Acesse sua conta</h1>
            <p>Entre ou crie uma conta gratuita.</p>
            <form id="form-login" class="formulario-login">
                <label class="campo">Login
                    <input id="login" type="text" placeholder="Digite seu login" required>
                </label>
                <label class="campo">Senha
                    <input id="senha" type="password" placeholder="Digite sua senha" required>
                </label>
                <button class="botao botao-primario" type="submit">Entrar</button>
                <button class="botao botao-secundario" type="button" id="registrar">Criar conta comum</button>
            </form>
            <p id="aviso" role="status"></p>
        </section>
    </main>

    <footer class="rodape">
        <div class="container rodape-conteudo">
            <span>Biblioteca Brasil</span>
            <p>Um espaço para cultivar o hábito da leitura.</p>
            <small>Projeto acadêmico · 2026</small>
        </div>
    </footer>
<script src="app.js" defer></script>
</body>
</html>
